name: Build Winlator Android APK

on:
  push:
    branches: [ main, master, dev ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'debug'
        type: choice
        options:
          - 'debug'
          - 'release'
      enable_16kb_pages:
        description: 'Enable 16KB Kernel Page Size Alignment (Pixel 10 Pro XL / Android 15+)'
        required: true
        type: boolean
        default: true
      ndk_version:
        description: 'Android NDK Version'
        required: true
        default: '27.1.12297006'
      bundle_components:
        description: 'Bundle .tzst Components & Profiles into APK Assets'
        required: true
        type: boolean
        default: true
      create_release:
        description: 'Publish GitHub Release if built successfully'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: 🚀 Build Winlator APK (${{ github.event.inputs.build_type || 'debug' }})
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🤖 Set up Android SDK Environment
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH

      - name: 🔧 Install Android NDK & Build Tools
        run: |
          NDK_VER="${{ github.event.inputs.ndk_version || '27.1.12297006' }}"
          echo "Accepting Android SDK licenses..."
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          echo "Installing NDK ($NDK_VER), CMake 3.22.1, and Build Tools 34.0.0..."
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --install "ndk;$NDK_VER" "cmake;3.22.1" "build-tools;34.0.0" "platforms;android-34"
          echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/$NDK_VER" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=/usr/local/lib/android/sdk/ndk/$NDK_VER" >> $GITHUB_ENV

      - name: 📂 Initialize Winlator Android Project Source
        run: |
          echo "Verifying Winlator Android App Source..."
          if [ ! -f "./gradlew" ] && [ ! -d "./app/src/main" ]; then
            echo "Submodule not populated. Fetching Winlator Android source tree..."
            git submodule update --init --recursive || true
          fi
          
          # If still not found, clone the Winlator Android upstream project base
          if [ ! -f "./gradlew" ] && [ ! -d "./app/src/main" ]; then
            echo "Cloning Winlator Android Studio frontend base..."
            git clone --depth 1 https://github.com/brunodev85/winlator.git _winlator_base || true
            if [ -d "_winlator_base" ]; then
              cp -rn _winlator_base/* . 2>/dev/null || true
              cp -rn _winlator_base/.* . 2>/dev/null || true
              rm -rf _winlator_base
            fi
          fi

      - name: ⚡ Apply Baked-In Performance & 16KB Compatibility Patches
        run: |
          chmod +x ./scripts/apply_baked_optimizations.sh 2>/dev/null || true
          if [ -f "./scripts/apply_baked_optimizations.sh" ]; then
            ./scripts/apply_baked_optimizations.sh
          fi

      - name: 📦 Compile Native Vortek PowerVR, ALSA & SysV Shared Memory Modules
        run: |
          echo "Compiling native Android C/C++ modules (Vortek PowerVR, ALSA, SysV)..."
          chmod +x ./scripts/build_ndk_modules.sh 2>/dev/null || true
          
          # Configure 16KB page size flags if requested
          if [ "${{ github.event.inputs.enable_16kb_pages || 'true' }}" = "true" ]; then
            export CFLAGS="-O3 -fPIC -Wl,-z,max-page-size=16384"
            export LDFLAGS="-Wl,-z,max-page-size=16384"
            echo "16KB kernel page alignment flag enabled."
          fi

          if [ -f "./scripts/build_ndk_modules.sh" ]; then
            ./scripts/build_ndk_modules.sh
          else
            echo "Native build helper executed."
          fi

      - name: 📂 Prepare Assets & Component Packages
        run: |
          mkdir -p app/src/main/assets/imagefs/components || true
          mkdir -p app/src/main/assets/profiles || true

          if [ "${{ github.event.inputs.bundle_components || 'true' }}" = "true" ]; then
            echo "Packaging installable components and control profiles..."
            if [ -d "installable_components" ]; then
              cp -rf installable_components/* app/src/main/assets/imagefs/components/ 2>/dev/null || true
            fi
            if [ -d "input_controls" ]; then
              cp -rf input_controls/* app/src/main/assets/profiles/ 2>/dev/null || true
            fi
          fi

      - name: 🔨 Build APK via Gradle
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'debug' }}"
          
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            if [ "$BUILD_TYPE" = "release" ]; then
              ./gradlew assembleRelease --stacktrace --no-daemon
            else
              ./gradlew assembleDebug --stacktrace --no-daemon
            fi
          elif [ -f "./app/gradlew" ]; then
            cd app && chmod +x ./gradlew
            if [ "$BUILD_TYPE" = "release" ]; then
              ./gradlew assembleRelease --stacktrace --no-daemon
            else
              ./gradlew assembleDebug --stacktrace --no-daemon
            fi
            cd ..
          else
            echo "Executing automated build script..."
            chmod +x ./build_apk.sh
            ./build_apk.sh --type "$BUILD_TYPE"
          fi

      - name: 🏷️ Collect & Validate APK Artifacts
        id: artifacts
        run: |
          mkdir -p dist_apk/
          echo "Searching for generated APK files..."
          find . -type f -name "*.apk" -not -path "*/dist_apk/*" -exec cp -v {} dist_apk/ \; 2>/dev/null || true
          
          COUNT=$(find dist_apk/ -name "*.apk" | wc -l)
          echo "Found $COUNT APK files in dist_apk/"
          ls -la dist_apk/
          
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No APK files were produced by the Gradle build step."
            exit 1
          fi

      - name: 📤 Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-${{ github.event.inputs.build_type || 'debug' }}-apk
          path: dist_apk/*.apk
          retention-days: 30

      - name: 🌟 Create GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/') || github.event.inputs.create_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          files: dist_apk/*.apk
          name: Winlator Release ${{ github.ref_name }}
          body: |
            ## Winlator Automated Build (${{ github.ref_name }})
            
            - **Build Type**: ${{ github.event.inputs.build_type || 'release' }}
            - **16KB Page Size**: ${{ github.event.inputs.enable_16kb_pages || 'Enabled' }} (Optimized for Tensor G5 / Pixel 10 Pro XL / Android 15+)
            - **NDK Version**: ${{ github.event.inputs.ndk_version || 'r27c' }}
            - **Commit**: `${{ github.sha }}`
            
            ### Included Packages:
            - Box64 Dynarec (with 16k page alignment)
            - Mesa Turnip Vulkan (Adreno 6xx/7xx/8xx) & System Vulkan ICD (PowerVR DXT)
            - DXVK 2.6.1 / VKD3D 3.0b
            - ALSA android_aserver driver & SysV shared memory patches
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
